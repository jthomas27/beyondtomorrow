name: Focused offline checks
on: [push, pull_request]

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: >-
          python -m pipeline.main --dry-run 'BLOG: CI smoke check'
      - run: python -m pipeline.storage.migrate
      - name: Test workflow boundaries, database access and Ghost tools
        run: >-
          python -m pytest tests/test_model_migration.py tests/test_ghost.py
          tests/test_db.py tests/test_schema_migrations.py
          tests/test_workflow_paths.py -m 'not integration' -q
