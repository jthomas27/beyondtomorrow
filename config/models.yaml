# Native OpenAI Responses API. Loaded once at worker startup.
# max_tokens includes reasoning and visible output; start with existing caps.
agents:
  orchestrator:
    model: gpt-6-luna
    reasoning_effort: none
    temperature: 0.1
    max_tokens: 2000
  researcher:
    model: gpt-6.1-sol
    reasoning_effort: low
    allow_fallback: false
    # Live research truncated valid evidence at 2,000 tokens; JSON needs this headroom.
    max_tokens: 4000
  writer:
    model: gpt-6.1-sol
    reasoning_effort: low
    allow_fallback: false
    max_tokens: 4000
  editor:
    model: gpt-6.1-sol
    reasoning_effort: low
    allow_fallback: false
    max_tokens: 4000
  publisher:
    model: gpt-6-luna
    reasoning_effort: none
    temperature: 0.0
    max_tokens: 1000
  indexer:
    model: gpt-6-luna
    reasoning_effort: none
    temperature: 0.0
    max_tokens: 500
  title_repair:
    model: gpt-6-luna
    reasoning_effort: none
    temperature: 0.3
    max_tokens: 64

# Routing order only; content agents explicitly disable cheaper fallbacks
# until their quality has been validated. Exhaustion defers the run.
fallback_chain:
  - gpt-6.1-sol
  - gpt-6-luna

degradation:
  soft_threshold_pct: 80
  hard_threshold_pct: 95
